name: Build and deploy

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Restore the per-task detail cache (completed tasks never change)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: pulse-details-${{ github.run_id }}
          restore-keys: pulse-details-
      - name: Fetch the API and build the site
        run: npm run build -- --fetch --base "${{ steps.pages.outputs.base_url }}/"
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
